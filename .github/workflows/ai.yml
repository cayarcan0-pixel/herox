name: MAZERUNNER AI - DeepSeek 8B + Bore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai:
    runs-on: windows-2022
    timeout-minutes: 300

    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}

    steps:

      # ==========================================
      # 1. PREPARE ENVIRONMENT
      # ==========================================
      - name: "01 - Prepare Environment"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:AI_API_KEY)) {
              throw "AI_API_KEY secret is missing"
          }

          $cleanKey = $env:AI_API_KEY.Trim() -replace "[\r\n]", ""
          Write-Host "Key length: $($cleanKey.Length)"

          New-Item -ItemType Directory -Force C:\AI | Out-Null
          Set-Content C:\AI\api-key.txt -Value $cleanKey -Encoding ascii -NoNewline
          "AI_API_KEY=$cleanKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $drive = Get-PSDrive C
          Write-Host "================================"
          Write-Host "MAZERUNNER AI INITIALIZATION"
          Write-Host "================================"
          Write-Host "Free disk: $([math]::Round($drive.Free / 1GB, 2)) GB"

          if ($drive.Free -lt 7GB) {
              throw "Insufficient disk space"
          }

          python --version
          python -m pip install requests --quiet
          Write-Host "Environment ready"

      # ==========================================
      # 2. DOWNLOAD HELPER
      # ==========================================
      - name: "02 - Create Download Manager"
        shell: pwsh
        run: |
          @'
          import requests
          import sys
          import os
          import time

          url, destination, label = sys.argv[1:4]
          os.makedirs(os.path.dirname(destination), exist_ok=True)

          for attempt in range(1, 4):
              try:
                  print(f"[{label}] Attempt {attempt}/3", flush=True)
                  if os.path.exists(destination):
                      os.remove(destination)

                  start = time.time()
                  last_report = start
                  downloaded = 0

                  with requests.get(url, stream=True, timeout=(30, 180), headers={"User-Agent": "MAZERUNNER-AI"}) as response:
                      response.raise_for_status()
                      total = int(response.headers.get("content-length", 0))

                      with open(destination, "wb") as f:
                          for chunk in response.iter_content(chunk_size=8 * 1024 * 1024):
                              if not chunk:
                                  continue
                              f.write(chunk)
                              downloaded += len(chunk)
                              now = time.time()
                              if now - last_report >= 15:
                                  elapsed = max(now - start, 0.1)
                                  speed = downloaded / elapsed / 1024 / 1024
                                  if total:
                                      percent = downloaded / total * 100
                                      print(f"[{label}] {percent:.0f}% | {speed:.1f} MB/s", flush=True)
                                  else:
                                      print(f"[{label}] {downloaded / 1024**2:.0f} MB | {speed:.1f} MB/s", flush=True)
                                  last_report = now

                  if os.path.getsize(destination) == 0:
                      raise RuntimeError("Downloaded file is empty")
                  print(f"[{label}] DOWNLOAD COMPLETE", flush=True)
                  sys.exit(0)

              except Exception as e:
                  print(f"[{label}] ERROR: {e}", flush=True)
                  if attempt == 3:
                      raise
                  time.sleep(5)
          '@ | Set-Content C:\AI\download.py -Encoding utf8
          Write-Host "Download manager ready"

      # ==========================================
      # 3. DOWNLOAD LLAMA.CPP
      # ==========================================
      - name: "03 - Download llama.cpp"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Searching llama.cpp Windows CPU release..."

          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=15" -TimeoutSec 60 -Headers @{ "User-Agent" = "MAZERUNNER-AI" }

          $asset = $null
          foreach ($release in $releases) {
              $cpuAsset = $release.assets | Where-Object { $_.name -match 'bin-win-cpu-x64\.zip$' } | Select-Object -First 1
              if ($cpuAsset) {
                  $asset = $cpuAsset
                  Write-Host "Selected: $($release.tag_name)"
                  break
              }
          }

          if (-not $asset) { throw "Windows CPU release not found" }

          python -u C:\AI\download.py $asset.browser_download_url C:\AI\llama.zip "LLAMA.CPP"
          if ($LASTEXITCODE -ne 0) { throw "llama.cpp download failed" }

          Expand-Archive C:\AI\llama.zip C:\AI\llama -Force
          $exe = Get-ChildItem C:\AI\llama -Filter llama-server.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "llama-server.exe not found" }

          "LLAMA_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          Write-Host "LLAMA.CPP READY"

      # ==========================================
      # 4. DOWNLOAD DEEPSEEK MODEL + BORE
      # ==========================================
      - name: "04 - Download DeepSeek + Bore"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # DeepSeek-R1-Distill-Llama-8B Q4_K_M (4.92 GB)
          $file = "DeepSeek-R1-Distill-Llama-8B-Q4_K_M.gguf"
          $url = "https://huggingface.co/bartowski/DeepSeek-R1-Distill-Llama-8B-GGUF/resolve/main/$file"

          Write-Host "Downloading DeepSeek-R1-Distill-Llama-8B Q4_K_M..."
          New-Item -ItemType Directory -Force C:\AI\model | Out-Null

          python -u C:\AI\download.py "$url" "C:\AI\model\$file" "DEEPSEEK"
          if ($LASTEXITCODE -ne 0) { throw "Model download failed" }
          if (-not (Test-Path "C:\AI\model\$file")) { throw "Model file missing" }

          "MODEL=C:\AI\model\$file" >> $env:GITHUB_ENV
          Write-Host "DEEPSEEK MODEL READY"

          # Bore indirme
          Write-Host "Downloading Bore..."
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ekzhang/bore/releases/latest" -TimeoutSec 60 -Headers @{ "User-Agent" = "MAZERUNNER-AI" }
          $asset = $release.assets | Where-Object { $_.name -match 'x86_64-pc-windows-msvc\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "Bore Windows release not found" }

          python -u C:\AI\download.py $asset.browser_download_url C:\AI\bore.zip "BORE"
          if ($LASTEXITCODE -ne 0) { throw "Bore download failed" }

          Expand-Archive C:\AI\bore.zip C:\AI\bore -Force
          $exe = Get-ChildItem C:\AI\bore -Filter bore.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "bore.exe not found" }

          "BORE_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          Write-Host "BORE READY"

      # ==========================================
      # 5. START AI + BORE (TEK KEEP-ALIVE DÖNGÜSÜ)
      # ==========================================
      - name: "05 - Start AI + Bore (Unified Keep-Alive)"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Starting MAZERUNNER AI (DeepSeek) + Bore..."

          $apiKey = $env:AI_API_KEY.Trim() -replace "[\r\n]", ""

          $aiOut  = "C:\AI\ai.log"
          $aiErr  = "C:\AI\ai-error.log"
          $boreOut = "C:\AI\bore.log"
          $boreErr = "C:\AI\bore-error.log"

          # ---------- AI START ----------
          function Start-AI {
              $aiArgs = @(
                  "-m", $env:MODEL,
                  "--host", "127.0.0.1",
                  "--port", "8080",
                  "--alias", "DEEPSEEK-R1",
                  "--ctx-size", "4096",
                  "--threads", "4",
                  "--batch-size", "128",
                  "--api-key", $apiKey,
                  "--jinja",
                  "--reasoning-budget", "0"
              )
              return Start-Process -FilePath $env:LLAMA_EXE -ArgumentList $aiArgs -PassThru -NoNewWindow `
                  -RedirectStandardOutput $aiOut -RedirectStandardError $aiErr
          }

          Write-Host "Starting AI server..."
          $aiProcess = Start-AI

          # AI hazır olana kadar bekle
          $aiReady = $false
          for ($i = 1; $i -le 90; $i++) {
              Start-Sleep -Seconds 6
              if ($aiProcess.HasExited) {
                  Get-Content $aiErr -Tail 40
                  throw "AI process exited during startup"
              }
              try {
                  $headers = @{ Authorization = "Bearer $apiKey" }
                  Invoke-RestMethod -Uri "http://127.0.0.1:8080/v1/models" -Headers $headers -TimeoutSec 8 | Out-Null
                  $aiReady = $true
                  break
              } catch {}
          }
          if (-not $aiReady) {
              Get-Content $aiErr -Tail 50
              throw "AI startup timeout"
          }
          Write-Host "AI READY"

          # ---------- BORE START ----------
          function Start-BoreWithPort {
              param([string]$Port)
              if (Test-Path $boreOut) { Remove-Item $boreOut -Force -ErrorAction SilentlyContinue }
              if (Test-Path $boreErr) { Remove-Item $boreErr -Force -ErrorAction SilentlyContinue }
              $bArgs = @("local", "8080", "--to", "bore.pub", "--port", $Port)
              return Start-Process -FilePath $env:BORE_EXE -ArgumentList $bArgs -WorkingDirectory "C:\AI" `
                  -RedirectStandardOutput $boreOut -RedirectStandardError $boreErr -NoNewWindow -PassThru
          }

          function Get-BorePort {
              param([int]$TimeoutSec = 20)
              for ($i = 1; $i -le $TimeoutSec; $i++) {
                  Start-Sleep -Seconds 1
                  $outContent = ""
                  $errContent = ""
                  if (Test-Path $boreOut) { $outContent = Get-Content $boreOut -Raw -ErrorAction SilentlyContinue }
                  if (Test-Path $boreErr) { $errContent = Get-Content $boreErr -Raw -ErrorAction SilentlyContinue }
                  $combined = "$outContent`n$errContent"
                  if ($combined -match "bore\.pub:(\d+)") { return $Matches[1] }
              }
              return $null
          }

          $PreferredPorts = @(31322, 31323, 31324, 31325, 31326, 31327)
          Write-Host "=== Trying preferred ports ==="

          $currentPort = $null
          $boreProcess = $null

          foreach ($p in $PreferredPorts) {
              Write-Host "Trying preferred port: $p ..."
              $proc = Start-BoreWithPort -Port $p
              Start-Sleep -Seconds 5
              $found = Get-BorePort -TimeoutSec 8
              if ($found -eq $p) {
                  Write-Host "SUCCESS: Locked preferred port $p"
                  $currentPort = $p
                  $boreProcess = $proc
                  break
              } else {
                  if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
                  Start-Sleep -Seconds 2
              }
          }

          if (-not $currentPort) {
              Get-Content $boreOut -Tail 20 -ErrorAction SilentlyContinue
              Get-Content $boreErr -Tail 20 -ErrorAction SilentlyContinue
              throw "None of the preferred ports are available (31322-31327)"
          }

          Write-Host ""
          Write-Host "==============================================="
          Write-Host "MAZERUNNER AI WEB UI (LOCKED PORT)"
          Write-Host "==============================================="
          Write-Host "Browser URL : http://bore.pub:$currentPort"
          Write-Host "API Key     : (secret AI_API_KEY)"
          Write-Host "==============================================="
          Write-Host ""

          # ---------- UNIFIED KEEP-ALIVE ----------
          Write-Host "=== Keep-Alive started (AI + Bore birlikte) ==="
          $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          Write-Host "[$time] Tunnel ACTIVE | Port: $currentPort | URL: http://bore.pub:$currentPort"

          $counter = 0
          while ($true) {
              $counter++

              # --- AI kontrol ---
              if ($aiProcess.HasExited) {
                  Write-Host "AI process died, restarting..."
                  $aiProcess = Start-AI
                  Start-Sleep -Seconds 8
                  $aiReady = $false
                  for ($i = 1; $i -le 30; $i++) {
                      Start-Sleep -Seconds 4
                      if ($aiProcess.HasExited) { break }
                      try {
                          $headers = @{ Authorization = "Bearer $apiKey" }
                          Invoke-RestMethod -Uri "http://127.0.0.1:8080/v1/models" -Headers $headers -TimeoutSec 8 | Out-Null
                          $aiReady = $true
                          break
                      } catch {}
                  }
                  if ($aiReady) { Write-Host "AI restarted OK" } else { Write-Host "AI restart failed" }
              }

              # --- Bore kontrol ---
              if ($boreProcess.HasExited) {
                  Write-Host "Bore process died, restarting..."
                  $boreProcess = Start-BoreWithPort -Port $currentPort
                  Start-Sleep -Seconds 4
                  $newPort = Get-BorePort -TimeoutSec 8
                  if ($newPort) {
                      if ($newPort -ne $currentPort) {
                          $currentPort = $newPort
                      }
                      $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
                      Write-Host ""
                      Write-Host "==============================================="
                      Write-Host "MAZERUNNER AI WEB UI (RECONNECTED)"
                      Write-Host "==============================================="
                      Write-Host "Browser URL : http://bore.pub:$currentPort"
                      Write-Host "==============================================="
                      Write-Host "[$time] Tunnel ACTIVE | Port: $currentPort | URL: http://bore.pub:$currentPort"
                      Write-Host ""
                  } else {
                      if (-not $boreProcess.HasExited) {
                          Stop-Process -Id $boreProcess.Id -Force -ErrorAction SilentlyContinue
                      }
                  }
              }

              # --- Her saat başı durum ---
              if ($counter % 720 -eq 0) {
                  $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
                  Write-Host "[$time] Tunnel ACTIVE | Port: $currentPort | URL: http://bore.pub:$currentPort"
              }

              Start-Sleep -Seconds 5
          }

      # ==========================================
      # 6. AUTO RESTART
      # ==========================================
      - name: "06 - Auto Restart"
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RUNNER }}
        run: |
          echo "Job ended, restarting workflow..."
          WORKFLOW_FILE="ai.yml"

          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}'
