
name: MAZERUNNER AI - Dolphin + Bore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Prepare Environment
        shell: pwsh
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:AI_API_KEY) {
            throw "Add AI_API_KEY in GitHub Repository Secrets first."
          }

          New-Item -ItemType Directory -Force C:\AI | Out-Null

          Set-Content C:\AI\api-key.txt $env:AI_API_KEY

          Write-Host "MAZERUNNER AI environment ready"

      - name: Download llama.cpp
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $release = Invoke-RestMethod `
            "https://api.github.com/repos/ggml-org/llama.cpp/releases/latest"

          $asset = $release.assets |
            Where-Object { $_.name -match 'bin-win-cpu-x64\.zip$' } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Windows CPU release not found"
          }

          Invoke-WebRequest $asset.browser_download_url `
            -OutFile C:\AI\llama.zip

          Expand-Archive C:\AI\llama.zip C:\AI\llama -Force

          $exe = Get-ChildItem C:\AI\llama `
            -Filter llama-server.exe -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "llama-server.exe missing"
          }

          "LLAMA_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

          Write-Host "llama.cpp installed"

      - name: Download Dolphin 8B
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade huggingface_hub

          $repo = "bartowski/Dolphin3.0-Llama3.1-8B-GGUF"
          $file = "Dolphin3.0-Llama3.1-8B-Q4_K_M.gguf"

          python -c "from huggingface_hub import hf_hub_download; hf_hub_download(repo_id='$repo', filename='$file', local_dir='C:/AI/model')"

          $model = "C:\AI\model\$file"

          if (-not (Test-Path $model)) {
            throw "Model download failed"
          }

          "MODEL=$model" >> $env:GITHUB_ENV

          Write-Host "Dolphin model downloaded"

      - name: Start AI Server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $args = @(
            "-m", $env:MODEL,
            "--alias", "dolphin",
            "--host", "127.0.0.1",
            "--port", "8080",
            "--ctx-size", "2048",
            "--threads", "4",
            "--api-key-file", "C:\AI\api-key.txt"
          )

          $ai = Start-Process `
            -FilePath $env:LLAMA_EXE `
            -ArgumentList $args `
            -PassThru `
            -NoNewWindow `
            -RedirectStandardOutput C:\AI\ai.log `
            -RedirectStandardError C:\AI\ai-error.log

          $ready = $false

          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 5

            if ($ai.HasExited) {
              Get-Content C:\AI\ai-error.log
              throw "AI server stopped"
            }

            try {
              Invoke-RestMethod `
                http://127.0.0.1:8080/health `
                -TimeoutSec 5 | Out-Null

              $ready = $true
              break
            }
            catch {}
          }

          if (-not $ready) {
            Get-Content C:\AI\ai-error.log -Tail 50
            throw "AI startup timeout"
          }

          Write-Host "DOLPHIN AI READY"

      - name: Download Bore
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $release = Invoke-RestMethod `
            "https://api.github.com/repos/ekzhang/bore/releases/latest"

          $asset = $release.assets |
            Where-Object { $_.name -match 'x86_64-pc-windows-msvc\.zip$' } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Windows Bore release not found"
          }

          Invoke-WebRequest $asset.browser_download_url `
            -OutFile C:\AI\bore.zip

          Expand-Archive C:\AI\bore.zip C:\AI\bore -Force

          $exe = Get-ChildItem C:\AI\bore `
            -Filter bore.exe -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "bore.exe missing"
          }

          "BORE_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

          Write-Host "Bore installed"

      - name: Start Bore AI Tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bore = Start-Process `
            -FilePath $env:BORE_EXE `
            -ArgumentList @(
              "local",
              "8080",
              "--to",
              "bore.pub"
            ) `
            -PassThru `
            -NoNewWindow `
            -RedirectStandardOutput C:\AI\bore.log `
            -RedirectStandardError C:\AI\bore-error.log

          $port = $null

          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2

            if ($bore.HasExited) {
              Get-Content C:\AI\bore-error.log
              throw "Bore tunnel stopped"
            }

            $logs = ""

            if (Test-Path C:\AI\bore.log) {
              $logs += Get-Content C:\AI\bore.log -Raw
            }

            if (Test-Path C:\AI\bore-error.log) {
              $logs += Get-Content C:\AI\bore-error.log -Raw
            }

            if ($logs -match 'bore\.pub:(\d+)') {
              $port = $Matches[1]
              break
            }
          }

          if (-not $port) {
            Get-Content C:\AI\bore.log
            Get-Content C:\AI\bore-error.log
            throw "Bore public port not detected"
          }

          "BORE_PORT=$port" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "===================================="
          Write-Host "MAZERUNNER AI ONLINE"
          Write-Host "===================================="
          Write-Host "API HOST: bore.pub:$port"
          Write-Host "API URL: http://bore.pub:$port/v1"
          Write-Host "MODEL: dolphin"
          Write-Host "LOCAL: http://127.0.0.1:8080/v1"
          Write-Host "API KEY: GitHub Secret AI_API_KEY"
          Write-Host "===================================="

      - name: Keep AI And Bore Alive
        shell: pwsh
        run: |
          Write-Host "MAZERUNNER AI ACTIVE"

          while ($true) {
            Start-Sleep -Seconds 30

            try {
              Invoke-RestMethod `
                http://127.0.0.1:8080/health `
                -TimeoutSec 10 | Out-Null
            }
            catch {
              throw "AI server health check failed"
            }

            Write-Host "AI ACTIVE | $(Get-Date)"
          }
