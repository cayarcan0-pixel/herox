name: Win11 Bore RDP Long

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 350 # 5 saat 50 dakika sonra işlemi güvenli bir şekilde kapatır

    steps:
      - name: Enable RDP + Create User
        run: |
          Write-Host "=== 1. Enabling RDP ==="
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          $svc = Get-Service TermService
          if ($svc.Status -ne "Running") { Start-Service TermService }
          Write-Host "RDP Enabled"

          Write-Host "=== 2. Creating User ==="
          $password = "MAZERUNNER-2027"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "SHACOV" -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name "SHACOV" -Password $securePass
          } else {
              New-LocalUser -Name "SHACOV" -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member "SHACOV" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "SHACOV" -ErrorAction SilentlyContinue
          Write-Host "User SHACOV ready"
      - name: Download Bore + Smart Fixed Port Tunnel
        shell: powershell
        run: |
          Write-Host "=== 3. Downloading Bore ==="
          
          # GitHub'ın resmi paket yöneticisi ile bore'u engelsiz kuruyoruz
          choco install bore-cli -y --no-progress
          
          $boreExe = "C:\ProgramData\chocolatey\bin\bore.exe"
          $boreDir = "C:\bore"
          if (-not (Test-Path $boreDir)) { New-Item -ItemType Directory -Path $boreDir -Force | Out-Null }
          
          Write-Host "bore.exe ready"
          & $boreExe --version
          
          $logOut = "$boreDir\bore_out.log"
          $logErr = "$boreDir\bore_err.log"
          
          function Start-BoreWithPort {
              param([string]$Port = $null)
              
              if (Test-Path $logOut) { Remove-Item $logOut -Force -ErrorAction SilentlyContinue }
              if (Test-Path $logErr) { Remove-Item $logErr -Force -ErrorAction SilentlyContinue }
              
              # Şifren üzerinden sunucu hangi portu verirse sonraki açılışlarda onu sabit tutacak kanka
              $mySecret = "mazerunner2027shacov"
              
              $args = @("local", "3389", "--to", "bore.pub", "--secret", $mySecret)
              
              $proc = Start-Process -FilePath $boreExe `
                  -ArgumentList $args `
                  -WorkingDirectory $boreDir `
                  -RedirectStandardOutput $logOut `
                  -RedirectStandardError $logErr `
                  -NoNewWindow `
                  -PassThru
              
              return $proc
          }
          
          function Get-BorePort {
              param([int]$TimeoutSec = 45)
              
              for ($i = 1; $i -le $TimeoutSec; $i++) {
                  Start-Sleep -Seconds 1
                  
                  $outContent = ""
                  $errContent = ""
                  if (Test-Path $logOut) { $outContent = Get-Content $logOut -Raw -ErrorAction SilentlyContinue }
                  if (Test-Path $logErr) { $errContent = Get-Content $logErr -Raw -ErrorAction SilentlyContinue }
                  $combined = "$outContent`n$errContent"
                  
                  if ($combined -match "bore\.pub:(\d+)") {
                      return $Matches[1]
                  }
                  
                  if ($process -and $process.HasExited) { return $null }
              }
              return $null
          }
          
          # ========== 1. Portu al ==========
          Write-Host ""
          Write-Host "=== 4. Getting port ==="
          
          $process = Start-BoreWithPort
          Write-Host "Process started. PID: $($process.Id)"
          
          $currentPort = Get-BorePort -TimeoutSec 45
          
          if (-not $currentPort) {
              Write-Host "FAILED to get port"
              if (Test-Path $logOut) { Get-Content $logOut }
              if (Test-Path $logErr) { Get-Content $logErr }
              exit 1
          }
          
          Write-Host ""
          Write-Host "==============================================="
          Write-Host "RDP CONNECTION INFO"
          Write-Host "==============================================="
          Write-Host "Address (Computer): bore.pub:$currentPort"
          Write-Host "Username:           SHACOV"
          Write-Host "Password:           MAZERUNNER-2027"
          Write-Host "==============================================="
          Write-Host ""
          
          # ========== 2. Smart Keep-Alive ==========
          Write-Host "=== 5. Smart Keep-Alive started ==="
          
          $counter = 0
          
          while ($true) {
              $counter++
              $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
              
              $isAlive = -not $process.HasExited
              
              if (-not $isAlive) {
                  Write-Host "[$time] Bore DIED (ExitCode: $($process.ExitCode))"
                  Write-Host "[$time] Restarting tunnel..."
                  $process = Start-BoreWithPort
                  Start-Sleep -Seconds 5
              }
              else {
                  Write-Host "[$time] Tunnel ACTIVE | Port: $currentPort | PID: $($process.Id) | Min: $counter"
              }
              
              if ($counter % 5 -eq 0) {
                  Write-Host "--- Last log lines ---"
                  if (Test-Path $logOut) { Get-Content $logOut -Tail 6 -ErrorAction SilentlyContinue }
                  if (Test-Path $logErr) { Get-Content $logErr -Tail 4 -ErrorAction SilentlyContinue }
                  Write-Host "----------------------"
              }
              
              Start-Sleep -Seconds 60
          }
