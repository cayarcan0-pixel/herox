name: Win11 Bore RDP Long

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2022

    steps:
      - name: Enable RDP + Create User
        run: |
          Write-Host "=== 1. Enabling RDP ==="
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          $svc = Get-Service TermService
          if ($svc.Status -ne "Running") { Start-Service TermService }
          Write-Host "RDP Enabled"

          Write-Host "=== 2. Creating User ==="
          $password = "MAZERUNNER-2027"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "NEXUSOWNER" -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name "NEXUSOWNER" -Password $securePass
          } else {
              New-LocalUser -Name "NEXUSOWNER" -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member "NEXUSOWNER" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "NEXUSOWNER" -ErrorAction SilentlyContinue
          Write-Host "User NEXUSOWNER ready"

      - name: Download Bore + Fixed Port Tunnel (NO PORT CHANGE)
        shell: powershell
        run: |
          Write-Host "=== 3. Downloading Bore ==="
          
          $boreDir = "C:\bore"
          New-Item -ItemType Directory -Path $boreDir -Force | Out-Null
          
          $zipPath = "$boreDir\bore.zip"
          $boreExe = "$boreDir\bore.exe"
          
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-pc-windows-msvc.zip" -OutFile $zipPath -UseBasicParsing
          Expand-Archive -Path $zipPath -DestinationPath $boreDir -Force
          
          if (-not (Test-Path $boreExe)) {
              Write-Host "ERROR: bore.exe not found!"
              Get-ChildItem $boreDir -Recurse
              exit 1
          }
          
          Write-Host "bore.exe ready"
          & $boreExe --version
          
          $logOut = "$boreDir\bore_out.log"
          $logErr = "$boreDir\bore_err.log"
          
          function Start-BoreWithPort {
              param([string]$Port)
              
              if (Test-Path $logOut) { Remove-Item $logOut -Force -ErrorAction SilentlyContinue }
              if (Test-Path $logErr) { Remove-Item $logErr -Force -ErrorAction SilentlyContinue }
              
              $args = @("local", "3389", "--to", "bore.pub", "--port", $Port)
              
              $proc = Start-Process -FilePath $boreExe `
                  -ArgumentList $args `
                  -WorkingDirectory $boreDir `
                  -RedirectStandardOutput $logOut `
                  -RedirectStandardError $logErr `
                  -NoNewWindow `
                  -PassThru
              
              return $proc
          }
          
          function Start-BoreRandom {
              if (Test-Path $logOut) { Remove-Item $logOut -Force -ErrorAction SilentlyContinue }
              if (Test-Path $logErr) { Remove-Item $logErr -Force -ErrorAction SilentlyContinue }
              
              $args = @("local", "3389", "--to", "bore.pub")
              
              $proc = Start-Process -FilePath $boreExe `
                  -ArgumentList $args `
                  -WorkingDirectory $boreDir `
                  -RedirectStandardOutput $logOut `
                  -RedirectStandardError $logErr `
                  -NoNewWindow `
                  -PassThru
              
              return $proc
          }
          
          function Get-BorePort {
              param([int]$TimeoutSec = 20)
              
              for ($i = 1; $i -le $TimeoutSec; $i++) {
                  Start-Sleep -Seconds 1
                  
                  $outContent = ""
                  $errContent = ""
                  if (Test-Path $logOut) { $outContent = Get-Content $logOut -Raw -ErrorAction SilentlyContinue }
                  if (Test-Path $logErr) { $errContent = Get-Content $logErr -Raw -ErrorAction SilentlyContinue }
                  $combined = "$outContent`n$errContent"
                  
                  if ($combined -match "bore\.pub:(\d+)") {
                      return $Matches[1]
                  }
              }
              return $null
          }
          
          # ========== Port listesi ==========
          $PreferredPorts = @(
              31321,
              31322,
              31323,
              31324,
              31325,
              31326
          )
          
          # ========== Yardimci: Verilen sirayla port dene, ilk tutani dondur ==========
          function Try-PortsInOrder {
              param([int[]]$Ports)
              
              foreach ($p in $Ports) {
                  Write-Host "Trying port: $p ..."
                  $proc = Start-BoreWithPort -Port $p
                  Start-Sleep -Seconds 5
                  
                  $found = Get-BorePort -TimeoutSec 8
                  
                  if ($found -eq "$p") {
                      Write-Host "SUCCESS: Locked port $p"
                      return @{ Port = "$p"; Process = $proc; Mode = "FIXED" }
                  } else {
                      Write-Host "Port $p unavailable. Killing attempt..."
                      if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
                      Start-Sleep -Seconds 2
                  }
              }
              return $null
          }
          
          # ========== Yardimci: Rastgele port al ==========
          function Try-RandomPort {
              Write-Host "Trying RANDOM port..."
              $proc = Start-BoreRandom
              Start-Sleep -Seconds 5
              
              $found = Get-BorePort -TimeoutSec 15
              
              if ($found) {
                  Write-Host "SUCCESS: Got random port $found"
                  return @{ Port = "$found"; Process = $proc; Mode = "RANDOM" }
              } else {
                  Write-Host "ERROR: Could not get random port."
                  if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
                  return $null
              }
          }
          
          # ========== 4. Baslangic: Once listeden dene, olmazsa rastgele ==========
          Write-Host ""
          Write-Host "=== 4. Initial connection ==="
          
          $primaryPort = $null      # Bir kere baglanilan port (her zaman ilk denenir)
          $primaryIsRandom = $false # Primary rastgele mi alindi?
          $process = $null
          
          $result = Try-PortsInOrder -Ports $PreferredPorts
          
          if ($result) {
              $primaryPort = $result.Port
              $process = $result.Process
              $primaryIsRandom = $false
          } else {
              Write-Host ""
              Write-Host "None of the preferred ports available. Falling back to RANDOM..."
              $result = Try-RandomPort
              
              if ($result) {
                  $primaryPort = $result.Port
                  $process = $result.Process
                  $primaryIsRandom = $true
              } else {
                  Write-Host "ERROR: Could not establish any tunnel. Exiting."
                  exit 1
              }
          }
          
          Write-Host ""
          Write-Host "==============================================="
          Write-Host "RDP CONNECTION INFO"
          Write-Host "Mode:               $(if ($primaryIsRandom) {'RANDOM (primary)'} else {'FIXED (listed)'})"
          Write-Host "Address (Computer): bore.pub:$primaryPort"
          Write-Host "Username:           NEXUSOWNER"
          Write-Host "Password:           MAZERUNNER-2027"
          Write-Host "==============================================="
          Write-Host ""
          
          # ========== 5. Keep-Alive ==========
          # Kural: Her zaman ONCE primary portu dene.
          #        Primary tutmazsa listeyi komple dene.
          #        Liste de tutmazsa rastgele dene.
          #        Yeni tutan port primary olur ve sonraki turlarda yine ilk o denenir.
          Write-Host "=== 5. Keep-Alive started ==="
          Write-Host "Logic: ALWAYS try primary port first. Then full list. Then random. New success becomes new primary."
          
          $counter = 0
          
          while ($true) {
              $counter++
              $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
              
              $isAlive = -not $process.HasExited
              
              if (-not $isAlive) {
                  Write-Host "[$time] Bore DIED (ExitCode: $($process.ExitCode))"
                  Write-Host "[$time] Reconnect order: primary ($primaryPort) -> full list -> random"
                  
                  $newResult = $null
                  
                  # 1) Once primary portu dene
                  Write-Host "[$time] Step 1: trying PRIMARY port $primaryPort ..."
                  $newResult = Try-PortsInOrder -Ports @([int]$primaryPort)
                  
                  # 2) Primary tutmadiysa listeyi komple dene
                  if (-not $newResult) {
                      Write-Host "[$time] Step 2: primary failed. Trying FULL LIST ..."
                      $newResult = Try-PortsInOrder -Ports $PreferredPorts
                  }
                  
                  # 3) Liste de tutmadiysa rastgele dene
                  if (-not $newResult) {
                      Write-Host "[$time] Step 3: full list failed. Trying RANDOM ..."
                      $newResult = Try-RandomPort
                  }
                  
                  if ($newResult) {
                      $primaryPort = $newResult.Port
                      $process = $newResult.Process
                      $primaryIsRandom = ($newResult.Mode -eq "RANDOM")
                      Write-Host "[$time] RECONNECTED. New primary port: $primaryPort (Mode: $($newResult.Mode))"
                  } else {
                      Write-Host "[$time] All attempts failed. Waiting 30s before next round..."
                      Start-Sleep -Seconds 30
                  }
              }
              else {
                  Write-Host "[$time] Tunnel ACTIVE | Primary Port: $primaryPort | Mode: $(if ($primaryIsRandom) {'RANDOM'} else {'FIXED'}) | PID: $($process.Id) | Min: $counter"
              }
              
              if ($counter % 5 -eq 0) {
                  Write-Host "--- Last log lines ---"
                  if (Test-Path $logOut) { Get-Content $logOut -Tail 6 -ErrorAction SilentlyContinue }
                  if (Test-Path $logErr) { Get-Content $logErr -Tail 4 -ErrorAction SilentlyContinue }
                  Write-Host "----------------------"
              }
              
              Start-Sleep -Seconds 60
          }

      - name: Kapaninca Otomatik Yeniden Baslat
        if: always()
        run: |
          curl -X POST `
          -H "Authorization: token ${{ secrets.RUNNER }}" `
          -H "Accept: application/vnd.github.v3+json" `
          https://github.com{{ github.repository }}/actions/workflows/main222.yml/dispatches `
          -d "{\""ref\"":\""${{ github.ref_name }}\""}"

